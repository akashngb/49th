substitutions:
  _SERVICE: roots-backend
  _REGION: us-central1
  _REPO: roots
  _SCHEDULER_JOB: roots-deadline-watchdog
  _SCHEDULER_CRON: "0 14 * * *"
  _SCHEDULER_TZ: America/Toronto
  _SERVICE_ACCOUNT: roots-runtime
  _VERTEX_SEARCH_DATASTORE: ""
  _VERTEX_SEARCH_LOCATION: "global"
  _MEDIA_BUCKET: ""
  _DEADLINE_WINDOW_DAYS: "7"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com
      - --timeout=120s
      - --memory=1Gi
      - --cpu=1
      - --concurrency=20
      - --min-instances=0
      - --max-instances=10
      - --set-env-vars=GCP_PROJECT=${PROJECT_ID},GCP_LOCATION=${_REGION},VERTEX_SEARCH_DATASTORE=${_VERTEX_SEARCH_DATASTORE},VERTEX_SEARCH_LOCATION=${_VERTEX_SEARCH_LOCATION},MEDIA_BUCKET=${_MEDIA_BUCKET},DEADLINE_WINDOW_DAYS=${_DEADLINE_WINDOW_DAYS}
      - --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,TWILIO_WHATSAPP_FROM=TWILIO_WHATSAPP_FROM:latest,ELEVENLABS_API_KEY=ELEVENLABS_API_KEY:latest,SCHEDULER_SHARED_SECRET=SCHEDULER_SHARED_SECRET:latest

  - id: schedule
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        URL=$(gcloud run services describe ${_SERVICE} --region=${_REGION} --format='value(status.url)')
        SA=${_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com
        if gcloud scheduler jobs describe ${_SCHEDULER_JOB} --location=${_REGION} >/dev/null 2>&1; then
          gcloud scheduler jobs update http ${_SCHEDULER_JOB} \
            --location=${_REGION} \
            --schedule="${_SCHEDULER_CRON}" \
            --time-zone="${_SCHEDULER_TZ}" \
            --uri="$$URL/jobs/deadline-watchdog" \
            --http-method=POST \
            --oidc-service-account-email="$$SA" \
            --oidc-token-audience="$$URL"
        else
          gcloud scheduler jobs create http ${_SCHEDULER_JOB} \
            --location=${_REGION} \
            --schedule="${_SCHEDULER_CRON}" \
            --time-zone="${_SCHEDULER_TZ}" \
            --uri="$$URL/jobs/deadline-watchdog" \
            --http-method=POST \
            --oidc-service-account-email="$$SA" \
            --oidc-token-audience="$$URL"
        fi

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}

options:
  logging: CLOUD_LOGGING_ONLY
